<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Relative URLs need the trailing slash (e.g. /user/<name>/ptyzer -> /user/<name>/ptyzer/).
    if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ptyzer: inspect Azorus .hp 4D-STEM datasets and convert them with py4DSTEM or Quantem.">
  <title>Ptyzer · ElectroSim</title>
  <!-- Relative URLs throughout: the app is also served under /user/<name>/<app>/ by jupyter-server-proxy. -->
  <link rel="icon" href="static/favicon-64.png" type="image/png">
  <link rel="stylesheet" href="static/electrosim-ui.css">
  <link rel="stylesheet" href="static/styles.css">
  <script>
    // Shared with the ElectroSim website and JupyterHub (same origin): "light" or "dark".
    try { const t = localStorage.getItem("es-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="static/js/main.js"></script>
</head>
<body class="es-app">
  <a class="pz-skip" href="#main">Skip to main content</a>
  <div class="pz-app" id="app">
    <div class="pz-frame">
      <header class="es-topbar pz-topbar">
        <button class="es-btn es-btn--quiet es-btn--sm pz-only-narrow" id="drawerToggle" type="button"
                aria-controls="sidebar" aria-expanded="false">Files</button>
        <a class="es-wordmark" href="#inspect"><span class="es-mark" role="img" aria-label="Electron Microscopy Research Group logo"></span><span class="pz-wm-name">electrosim</span> <small>Ptyzer</small></a>
        <nav aria-label="Main">
          <ul class="es-nav">
            <li><a href="#inspect" data-view="inspect" aria-current="page">Inspect</a></li>
            <li><a href="#runs" data-view="runs">Runs<span class="pz-count" id="runsCount" hidden></span></a></li>
          </ul>
        </nav>
        <div class="es-end">
          <button class="es-btn es-btn--quiet es-btn--sm pz-env" id="envPill" type="button"
                  aria-haspopup="dialog" aria-expanded="false" aria-controls="envPopover">
            <span class="es-sr-only">Selected engine:</span>
            <span class="es-status es-status--idle" id="envStatus">Checking</span><span class="pz-env-text" id="envText"></span>
          </button>
          <button class="es-btn es-btn--quiet es-btn--sm" id="themeToggle" type="button">
            <span class="pz-swatch" aria-hidden="true"></span><span class="pz-theme-text">Theme</span>
          </button>
        </div>
      </header>
    </div>
    <div class="pz-body">
      <aside class="pz-sidebar" id="sidebar" aria-label="Files"></aside>
      <main class="pz-main" id="main" tabindex="-1">
        <div class="pz-view pz-view-inspect" id="viewInspect">
          <div class="pz-inspect" id="inspect"></div>
          <section class="pz-convert" id="convert" aria-labelledby="convertTitle"></section>
        </div>
        <div class="pz-view pz-view-runs" id="viewRuns" hidden></div>
      </main>
    </div>
  </div>
  <div class="pz-popover" id="envPopover" role="dialog" aria-label="Python environment" hidden></div>
  <div class="pz-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Figure viewer" hidden></div>
  <div class="pz-toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
